services:
  - type: web
    name: whatsapp-sender-saas
    runtime: node
    buildCommand: npm install && npx puppeteer install && npm run build
    startCommand: npm start
    envVars:
      - key: ADMIN_EMAIL
        placeholder: "Enter admin login email"
      - key: ADMIN_PASSWORD
        placeholder: "Enter admin login password"
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
