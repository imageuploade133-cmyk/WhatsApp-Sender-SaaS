services:
  - type: web
    name: whatsapp-sender-saas
    runtime: node
    buildCommand: PUPPETEER_CACHE_DIR=.cache/puppeteer npm install && PUPPETEER_CACHE_DIR=.cache/puppeteer npx puppeteer browsers install chrome && npm run build
    startCommand: npm start
    envVars:
      - key: ADMIN_EMAIL
        placeholder: "Enter admin login email"
      - key: ADMIN_PASSWORD
        placeholder: "Enter admin login password"
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
      - key: PUPPETEER_CACHE_DIR
        value: ".cache/puppeteer"
